name: Native Linux release
on:
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy this release to the VPS (main only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - '!app/src/**/*.md'
      - '!app/src/**/*.test.*'
      - '!app/src/**/*.spec.*'
      - 'app/public/**'
      - 'app/seed-assets/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/pnpm-workspace.yaml'
      - 'app/next.config.ts'
      - 'app/tsconfig.json'
      - 'app/postcss.config.mjs'
      - 'app/biome.json'
      - 'app/scripts/build.mjs'
      - 'app/scripts/generate-payload-types.mjs'
      - 'app/scripts/generate-tokens.mjs'
      - 'app/scripts/lib/payload-type-paths.mjs'
      - 'app/scripts/split-payload-types.mjs'
      - 'app/scripts/release/build.mjs'
      - 'app/scripts/release/verify.mjs'
      - 'deploy/*.sh'
      - 'deploy/extract-release.py'
      - 'deploy/systemd/*.service'
      - 'deploy/systemd/*.timer'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:build
      - run: node scripts/release/verify.mjs
      - name: Archive verified release
        run: |
          for script in ../deploy/*.sh; do
            bash -n "$script"
          done
          deployment=artifacts/release/deploy
          mkdir -p "$deployment/nginx" "$deployment/systemd"
          cp ../deploy/*.sh ../deploy/extract-release.py ../deploy/app.env.example "$deployment/"
          cp ../deploy/nginx/*.conf "$deployment/nginx/"
          cp ../deploy/systemd/*.service ../deploy/systemd/*.timer "$deployment/systemd/"
          tar -czf artifacts/promformatech-linux-x64.tar.gz -C artifacts/release .
          cd artifacts
          sha256sum promformatech-linux-x64.tar.gz > promformatech-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promformatech-${{ github.sha }}
          path: |
            app/artifacts/promformatech-linux-x64.tar.gz
            app/artifacts/promformatech-linux-x64.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.VPS_AUTO_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promformatech-${{ github.sha }}
          path: release
      - name: Confirm that the release is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::This release is no longer the tip of main. Deploy the latest release instead.'
            exit 1
          fi
      - name: Deliver and activate verified release
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_DEPLOY_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo '::error::Set the Actions variable VPS_HOST to the VPS hostname or IPv4 address.'
            exit 1
          fi
          if [[ -z "$VPS_DEPLOY_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo '::error::Set the Actions secrets VPS_DEPLOY_PRIVATE_KEY and VPS_KNOWN_HOSTS.'
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/pft-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/pft-known-hosts"
          cd release
          archive=promformatech-linux-x64.tar.gz
          sha256sum -c "$archive.sha256"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          options=(-i "$HOME/.ssh/pft-deploy" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/pft-known-hosts"
            -o ConnectTimeout=15)
          python3 - "$archive" <<'PY' | ssh "${options[@]}" "pft-deploy@$VPS_HOST" \
            "deploy $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $digest"
          import os
          import signal
          import sys
          from time import monotonic

          def report(sent, total):
              percent = sent * 100 // total
              print(f"Archive transfer: {sent / 1e6:.1f}/{total / 1e6:.1f} MB ({percent}%)",
                    file=sys.stderr, flush=True)

          signal.signal(signal.SIGPIPE, signal.SIG_DFL)
          with open(sys.argv[1], "rb") as archive:
              total = os.fstat(archive.fileno()).st_size
              if not total:
                  raise SystemExit("Release archive is empty.")
              sent = 0
              report(sent, total)
              last_report = monotonic()
              while chunk := archive.read(256 * 1024):
                  sys.stdout.buffer.write(chunk)
                  sys.stdout.buffer.flush()
                  sent += len(chunk)
                  now = monotonic()
                  if sent == total or now - last_report >= 5:
                      report(sent, total)
                      last_report = now
          PY
      - name: Confirm public HTTPS readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 10 \
            https://promformateh.ru/api/health/ready | jq -e '.status == "ready"' >/dev/null
          echo 'Public HTTPS readiness: confirmed.'
