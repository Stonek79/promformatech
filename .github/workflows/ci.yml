name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Application and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3
      - name: Check deployment scripts
        run: |
          for script in ../deploy/*.sh; do
            bash -n "$script"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ../deploy/tests -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:media
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
