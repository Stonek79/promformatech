# Installed in /etc/nginx/sites-available/promformatech, inside http {}.
# Replace example.com with the real domain; certbot adds HTTPS after DNS is ready.
limit_req_zone $binary_remote_addr zone=pft_login:1m rate=5r/m;
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    server_tokens off;
    client_max_body_size 502m;
    client_body_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/users/login {
        limit_req zone=pft_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/promformatech-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/promformatech-proxy.conf;
    }
}
